name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      - name: Test
        run: npm test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The README offers `bunx --bun`, so the built CLI must run under Bun and
      # print what Node prints. An empty store keeps both runs on the same data.
      - name: Smoke test under Bun
        run: |
          store=$(mktemp -d)
          payload='{"session_id":"smoke","workspace":{"current_dir":"'"$PWD"'"},"model":{"id":"claude-opus-4-5","display_name":"Opus 4.5"},"cost":{"total_cost_usd":1.5,"total_duration_ms":60000,"total_api_duration_ms":20000,"total_lines_added":3,"total_lines_removed":1},"context_window":{"context_window_size":200000,"current_usage":{"input_tokens":10,"output_tokens":5,"cache_creation_input_tokens":100,"cache_read_input_tokens":98000}}}'
          for style in powerline tui; do
            node_out=$(echo "$payload" | CLAUDE_CONFIG_DIR="$store" COLUMNS=120 node dist/index.mjs --style=$style)
            bun_out=$(echo "$payload" | CLAUDE_CONFIG_DIR="$store" COLUMNS=120 bun dist/index.mjs --style=$style)
            if [ -z "$bun_out" ] || [ "$node_out" != "$bun_out" ]; then
              printf 'Bun output differs from Node for --style=%s\n--- node\n%s\n--- bun\n%s\n' "$style" "$node_out" "$bun_out"
              exit 1
            fi
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      
      - name: Upgrade npm for trusted publishing (OIDC requires npm >= 11.5.1)
        run: npm install -g npm@latest
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release